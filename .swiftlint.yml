# 个人项目的检查集。排版交给 SwiftFormat。
only_rules:
  - duplicate_conditions
  - duplicate_imports
  - unused_control_flow_label
  - unused_enumerated
  - void_function_in_ternary
  - unused_setter_value
  - reduce_into
  - discarded_notification_center_observer
  - unhandled_throwing_task
  - force_unwrapping
  - force_cast
  - force_try
  - cyclomatic_complexity

cyclomatic_complexity:
  # MetadataValue 按类型逐项编解码，分支内部的条件与循环仍参与计数。
  ignores_case_statements: true

excluded:
  - "**/.build"
  - "**/.swiftpm"
  - "**/DerivedData"
  - .references
  - .codegraph
