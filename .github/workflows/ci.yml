name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Swift 6.2
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Check formatting and lint
        run: |
          mkdir -p "$RUNNER_TEMP/style"
          cd "$RUNNER_TEMP/style"
          curl -fsSL --retry 3 -o swiftformat.zip https://github.com/nicklockwood/SwiftFormat/releases/download/0.61.0/swiftformat.zip
          curl -fsSL --retry 3 -o swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          shasum -a 256 -c <<'CHECKSUMS'
          0356130b976e0cc1022dd6712da7a23319203125ba208fad9f37b06e9feca994  swiftformat.zip
          c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  swiftlint.zip
          CHECKSUMS
          unzip -q swiftformat.zip swiftformat
          unzip -q swiftlint.zip swiftlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/style/swiftformat" --lint Package.swift Sources Tests
          "$RUNNER_TEMP/style/swiftlint" lint --strict Package.swift Sources Tests

      - name: Run Debug tests
        run: swift test

      - name: Run Release tests
        run: swift test -c release

      - name: Build for iOS, tvOS and watchOS
        run: |
          build_for_device() {
            local sdk_path
            sdk_path=$(xcrun --sdk "$1" --show-sdk-path)
            swift build -c release --target Telescopium \
              --sdk "$sdk_path" --triple "$2" --scratch-path "$RUNNER_TEMP/build/$2"
          }

          build_for_device iphoneos arm64-apple-ios16.0
          build_for_device appletvos arm64-apple-tvos16.0
          build_for_device watchos arm64_32-apple-watchos9.0
          build_for_device watchos arm64-apple-watchos9.0
